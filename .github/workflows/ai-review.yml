name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  determine-context:
    runs-on: ubuntu-latest
    outputs:
      info: ${{ steps.context.outputs.info }}
    steps:
      - name: Determine tv7-core context
        id: context
        run: |
          {
            echo "info=TV7 Core: shared standards, workflows, and tooling"
          } >> "$GITHUB_OUTPUT"

  deepseek-review:
    needs: determine-context
    uses: ./.github/workflows/deepseek-review.yml
    with:
      project_context: ${{ needs.determine-context.outputs.info }}
    secrets: inherit
