name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  determine-context:
    runs-on: ubuntu-latest
    outputs:
      info: ${{ steps.context.outputs.info }}
    steps:
      - name: Determine tv7-core context
        id: context
        run: |
          {
            echo "info=TV7 Core – canonical shared standards, workflows, and tooling; symlinked into sibling repos (see docs/symlink-map.md). Key refs: docs/agent-best-practices.md (agent rules), docs/tv7_high_architecture.md (architecture), docs/backend_architecture.md / docs/engine_architecture.md (system details), tooling/Makefile.core (shared make targets)."
          } >> "$GITHUB_OUTPUT"

  deepseek-review:
    needs: determine-context
    uses: ./.github/workflows/deepseek-review.yml
    with:
      project_context: ${{ needs.determine-context.outputs.info }}
      architecture_doc: core_architecture.md
    secrets: inherit
