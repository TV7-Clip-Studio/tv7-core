# Reusable DeepSeek review workflow.
# Purpose: run DeepSeek on PR diffs with branch/size guardrails and post a single PR comment.
# Required secret: DEEPSEEK_API_KEY (inherit secrets in the caller).
# Usage (same repo): uses: ./.github/workflows/deepseek-review.yml
# Usage (from other repos): uses: TV7-Clip-Studio/tv7-core/.github/workflows/deepseek-review.yml@main

name: DeepSeek Review (reusable)

on:
  workflow_call:
    inputs:
      run_on_branches:
        description: "Comma/space-separated base branches allowed to run DeepSeek on (default: main)."
        required: false
        type: string
        default: "main"
      min_changed_lines:
        description: "Minimum total changed lines (additions + deletions) to run DeepSeek."
        required: false
        type: number
        default: 5
      project_context:
        description: "Short project context string provided by the caller (SDK/framework versions, key deps)."
        required: false
        type: string
        default: "General Codebase (context not provided)"
      architecture_doc:
        description: "Single architecture doc filename from tv7-core/docs to include (e.g., backend_architecture.md)."
        required: false
        type: string
        default: ""
      core_doc_list:
        description: "Space-separated list of core docs (filenames in docs/) to include (default: tv7_high_architecture.md roadmap.md)."
        required: false
        type: string
        default: "tv7_high_architecture.md roadmap.md"
    secrets:
      DEEPSEEK_API_KEY:
        required: true
      TV7_CORE_APP_ID:
        required: false
      TV7_CORE_APP_PRIVATE_KEY:
        required: false

jobs:
  deepseek-review:
    name: DeepSeek Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App token (tv7-core docs)
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TV7_CORE_APP_ID }}
          private-key: ${{ secrets.TV7_CORE_APP_PRIVATE_KEY }}
          owner: TV7-Clip-Studio
          repositories: tv7-core
        continue-on-error: true

      - name: Debug app token minted
        run: |
          echo "Has app id? ${{ secrets.TV7_CORE_APP_ID != '' }}"
          echo "Has private key? ${{ secrets.TV7_CORE_APP_PRIVATE_KEY != '' }}"
          echo "Token present? ${{ steps.app-token.outputs.token != '' }}"

      - name: Checkout tv7-core docs (context)
        if: steps.app-token.outputs.token != ''
        uses: actions/checkout@v4
        with:
          repository: TV7-Clip-Studio/tv7-core
          ref: main
          path: temp-tv7-core-docs
          sparse-checkout: |
            docs
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip tv7-core docs checkout (fork/missing app secrets)
        if: steps.app-token.outputs.token == ''
        run: echo "Skipping tv7-core docs checkout (fork PR or missing app secrets)."


      - name: Guard - branch and change thresholds
        id: guard
        shell: bash
        env:
          RUN_ON_BRANCHES: ${{ inputs.run_on_branches }}
          MIN_CHANGED: ${{ inputs.min_changed_lines }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          should_run=true
          reason="ok"
          changed_lines=0

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            should_run=false
            reason="Not a pull_request event; skipping"
          elif [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            should_run=false
            reason="Fork PR detected; DeepSeek review disabled for forks"
          else
            changed_lines=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk '{add+=$1; del+=$2} END {print add+del+0}')
            match=false
            for raw in $(echo "$RUN_ON_BRANCHES" | tr ',' ' '); do
              branch=$(echo "$raw" | xargs)
              [ -z "$branch" ] && continue
              if [ "$BASE_REF" = "$branch" ]; then
                match=true
              fi
            done
            if [ "$match" != "true" ]; then
              should_run=false
              reason="Base branch '$BASE_REF' not in run_on_branches '$RUN_ON_BRANCHES'"
            elif [ "$changed_lines" -lt "$MIN_CHANGED" ]; then
              should_run=false
              reason="Changed lines $changed_lines below threshold $MIN_CHANGED"
            fi
          fi

          {
            echo "should-run=$should_run"
            echo "reason=$reason"
            echo "changed-lines=$changed_lines"
          } >> "$GITHUB_OUTPUT"

      - name: Skip DeepSeek review
        if: steps.guard.outputs.should-run != 'true'
        run: |
          echo "Skipping DeepSeek review: ${{ steps.guard.outputs.reason }}"

      - name: Collect PR diff (unified=0, non-deleted files only)
        if: steps.guard.outputs.should-run == 'true'
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          # Exclude deleted-file hunks from model input to reduce payload size.
          git diff --unified=0 --no-color --diff-filter=ACMRTUXB "$BASE_SHA" "$HEAD_SHA" > /tmp/pr_diff.txt
          git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$HEAD_SHA" > /tmp/pr_changed_files.txt
          bytes=$(wc -c < /tmp/pr_diff.txt | tr -d ' ')
          echo "diff-bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "changed-files-path=/tmp/pr_changed_files.txt" >> "$GITHUB_OUTPUT"

      - name: Build PR summary (changed files only)
        if: steps.guard.outputs.should-run == 'true'
        id: summary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUMMARY_CAP_BYTES: 80000
          MAX_CHANGED_FILES: 350
        run: |
          set -eo pipefail
          python - <<'PY'
          import os
          import subprocess
          from collections import Counter
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          cap_bytes = int(os.environ.get("SUMMARY_CAP_BYTES", "80000"))
          max_changed_files = int(os.environ.get("MAX_CHANGED_FILES", "350"))
          summary_path = Path("/tmp/pr_summary.txt")

          def run(cmd: list[str]) -> list[str]:
            out = subprocess.check_output(cmd, text=True)
            return [line for line in out.splitlines() if line.strip()]

          name_status = run(["git", "diff", "--name-status", base, head])
          numstat = run(["git", "diff", "--numstat", base, head])
          status_rows: list[tuple[str, str]] = []
          for line in name_status:
            parts = line.split("\t")
            if not parts:
              continue
            status = parts[0]
            path = ""
            if (status.startswith("R") or status.startswith("C")) and len(parts) >= 3:
              path = f"{parts[1]} -> {parts[2]}"
            elif len(parts) >= 2:
              path = parts[1]
            if path:
              status_rows.append((status, path))

          adds_dels: dict[str, tuple[str, str]] = {}
          for line in numstat:
            parts = line.split("\t")
            if len(parts) >= 3:
              add, delete, path = parts[0], parts[1], parts[2]
              adds_dels[path] = (add, delete)

          lines: list[str] = []
          lines.append("=== Changed files (status add/del) ===")
          if not status_rows:
            lines.append("(none)")
          else:
            status_counts = Counter(status[0] for status, _ in status_rows)
            lines.append(
              "Totals: "
              + ", ".join(
                  f"{code}={status_counts.get(code, 0)}"
                  for code in ["A", "M", "R", "C", "D", "T", "U"]
                  if status_counts.get(code, 0) > 0
              )
            )
            lines.append("")
            for status, path in status_rows[:max_changed_files]:
              add, delete = adds_dels.get(path, ("-", "-"))
              lines.append(f"[{status}] +{add}/-{delete} {path}")
            if len(status_rows) > max_changed_files:
              lines.append(f"... ({len(status_rows) - max_changed_files} additional changed files omitted)")

          text = "\n".join(lines)
          truncated = False
          # Truncate safely on character boundaries until encoded length <= cap_bytes
          while len(text.encode("utf-8")) > cap_bytes:
            truncated = True
            # remove a chunk to speed up trimming on very large summaries
            text = text[:-1000] if len(text) > 1000 else text[:-1]
          if truncated:
            text += f"\n\n[summary truncated at {cap_bytes} bytes]"

          encoded = text.encode("utf-8")
          summary_path.write_text(text, encoding="utf-8")
          print(f"summary-bytes={len(encoded)}")
          if truncated:
            print("summary-truncated=true")
          PY
          echo "summary-path=/tmp/pr_summary.txt" >> "$GITHUB_OUTPUT"

      - name: Log context inputs
        if: steps.guard.outputs.should-run == 'true'
        run: |
          summary_bytes=$(wc -c < /tmp/pr_summary.txt 2>/dev/null || echo 0)
          diff_bytes=$(wc -c < /tmp/pr_diff.txt 2>/dev/null || echo 0)
          echo "Context: summary bytes=${summary_bytes}, diff bytes=${diff_bytes}"
          echo "Requested architecture_doc='${{ inputs.architecture_doc }}'"
          echo "Core doc list='${{ inputs.core_doc_list }}'"

      - name: Collect previous DeepSeek reviews
        if: steps.guard.outputs.should-run == 'true'
        id: history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail
          
          # Fetch reviews and comments of the PR using gh, fail gracefully if it fails
          if ! gh pr view "$PR_NUMBER" --json reviews,comments > /tmp/pr_comments_raw.json 2>/dev/null; then
            echo "Warning: Could not fetch PR comments or reviews. Continuing without history."
            echo "No previous review history found." > /tmp/pr_history.txt
            echo "" > /tmp/reviewed_sha.txt
            echo "No previous PR discussions found." > /tmp/pr_qa_history.txt
          else
            python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          
          raw_path = Path("/tmp/pr_comments_raw.json")
          out_history = Path("/tmp/pr_history.txt")
          out_qa = Path("/tmp/pr_qa_history.txt")
          out_sha = Path("/tmp/reviewed_sha.txt")
          
          if not raw_path.exists():
              out_history.write_text("No previous review history found.", encoding="utf-8")
              out_qa.write_text("No previous PR discussions found.", encoding="utf-8")
              out_sha.write_text("", encoding="utf-8")
              sys.exit(0)
              
          try:
              data = json.loads(raw_path.read_text(encoding="utf-8", errors="ignore"))
          except Exception:
              data = {}
              
          reviews = data.get("reviews") or []
          comments = data.get("comments") or []
          
          all_items = []
          for r in reviews:
              author = r.get("author", {}).get("login") or ""
              body = r.get("body") or ""
              date = r.get("submittedAt") or ""
              all_items.append((date, author, body))
              
          # Sort items by date ascending
          all_items.sort(key=lambda x: x[0])
          
          # Find the latest review that looks like a DeepSeek review
          latest_ds_review = None
          for date, author, body in reversed(all_items):
              if "DeepSeek review" in body or "FINAL_VERDICT" in body:
                  latest_ds_review = body
                  break
                  
          if latest_ds_review:
              out_history.write_text(latest_ds_review, encoding="utf-8")
              print("Found previous DeepSeek review.")
              # Extract REVIEWED_SHA
              sha_match = re.search(r"<!--\s*REVIEWED_SHA:\s*([a-f0-9]+)\s*-->", latest_ds_review, re.IGNORECASE)
              if sha_match:
                  sha = sha_match.group(1).strip()
                  out_sha.write_text(sha, encoding="utf-8")
                  print(f"Found previous reviewed SHA: {sha}")
              else:
                  out_sha.write_text("", encoding="utf-8")
          else:
              out_history.write_text("No previous DeepSeek review found in this PR.", encoding="utf-8")
              out_sha.write_text("", encoding="utf-8")
              print("No previous DeepSeek review found.")
              
          # Group comments into threads for QA Memory
          threads = {}
          parent_map = {}
          
          for c in comments:
              c_id = c.get("id")
              reply_to = c.get("replyTo")
              if not reply_to:
                  threads[c_id] = [c]
                  parent_map[c_id] = c_id
              else:
                  parent_map[c_id] = reply_to
                  
          for c in comments:
              c_id = c.get("id")
              reply_to = c.get("replyTo")
              if reply_to:
                  parent = parent_map.get(reply_to, reply_to)
                  if parent not in threads:
                      threads[parent] = []
                  threads[parent].append(c)
                  
          # Filter threads containing DeepSeek keywords
          ds_threads = []
          for parent, thread_comments in threads.items():
              thread_comments.sort(key=lambda x: x.get("createdAt", ""))
              has_ds = any("DeepSeek review" in c.get("body", "") or "FINAL_VERDICT" in c.get("body", "") for c in thread_comments)
              if has_ds:
                  ds_threads.append(thread_comments)
                  
          qa_parts = []
          if ds_threads:
              qa_parts.append("## PR QA & Discussion History")
              for i, thread in enumerate(ds_threads, 1):
                  qa_parts.append(f"=== Thread #{i} ===")
                  for c in thread:
                      author = c.get("author", {}).get("login") or "unknown"
                      body = c.get("body") or ""
                      date = c.get("createdAt") or ""
                      qa_parts.append(f"- {author} [{date}]: {body}")
                  qa_parts.append("")
                  
          if qa_parts:
              out_qa.write_text("\n".join(qa_parts), encoding="utf-8")
          else:
              out_qa.write_text("No previous PR discussions found.", encoding="utf-8")
          PY
          fi
          echo "history-path=/tmp/pr_history.txt" >> "$GITHUB_OUTPUT"
          echo "qa-path=/tmp/pr_qa_history.txt" >> "$GITHUB_OUTPUT"
          echo "reviewed-sha-path=/tmp/reviewed_sha.txt" >> "$GITHUB_OUTPUT"


      - name: Call DeepSeek
        if: steps.guard.outputs.should-run == 'true'
        id: deepseek
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DIFF_PATH: /tmp/pr_diff.txt
          DIFF_CAP_BYTES: 300000
          SUMMARY_PATH: /tmp/pr_summary.txt
          PROJECT_CONTEXT: ${{ inputs.project_context }}
          DOCS_PATH: temp-tv7-core-docs/docs
          ARCH_DOC: ${{ inputs.architecture_doc }}
          CORE_DOC_LIST: ${{ inputs.core_doc_list }}
          DOC_FILE_CAP_BYTES: 18000
          DOCS_TOTAL_CAP_BYTES: 60000
        run: |
          set -eo pipefail
          if [ ! -s "$DIFF_PATH" ]; then
            echo "No diff content found; skipping call."
            exit 0
          fi

          # Load allowed context files from docs/
          docs_context=""
          docs_context_bytes=0
          max_doc_file_bytes="${DOC_FILE_CAP_BYTES:-18000}"
          max_docs_bytes="${DOCS_TOTAL_CAP_BYTES:-60000}"
          safe_arch_doc=""
          safe_core_docs=()

          # validate and collect core doc list
          if [ -n "${CORE_DOC_LIST:-}" ]; then
            for candidate in ${CORE_DOC_LIST}; do
              if [[ "$candidate" != */* && "$candidate" != *..* && "$candidate" == *.md ]]; then
                safe_core_docs+=("$candidate")
              else
                echo "Warning: core doc '${candidate}' is invalid (must be basename ending in .md); ignoring."
              fi
            done
          fi

          if [ -n "${ARCH_DOC:-}" ]; then
            # validate: basename only, no slash/.., must end with .md
            if [[ "$ARCH_DOC" != */* && "$ARCH_DOC" != *..* && "$ARCH_DOC" == *.md ]]; then
              safe_arch_doc="$ARCH_DOC"
            else
              echo "Warning: ARCH_DOC '${ARCH_DOC}' is invalid (must be basename ending in .md); ignoring."
            fi
          fi

          if [ -d "$DOCS_PATH" ]; then
            files_to_include="${safe_core_docs[*]}"
            if [ -n "$safe_arch_doc" ]; then
              files_to_include="$files_to_include $safe_arch_doc"
            fi
            for filename in $files_to_include; do
              if [ "$docs_context_bytes" -ge "$max_docs_bytes" ]; then
                echo "Docs context reached cap (${max_docs_bytes} bytes)."
                break
              fi
              file="$DOCS_PATH/$filename"
              if [ ! -f "$file" ]; then
                file=$(find "$DOCS_PATH" -type f -name "$filename" | head -n 1 || true)
              fi
              if [ -f "$file" ]; then
                file_bytes=$(wc -c < "$file" | tr -d ' ')
                content=$(head -c "$max_doc_file_bytes" "$file")
                block=$(printf "\n\n=== Documentation: %s ===\n%s" "$filename" "$content")
                if [ "$file_bytes" -gt "$max_doc_file_bytes" ]; then
                  block="${block}"$'\n\n'"[${filename} truncated at ${max_doc_file_bytes} bytes]"
                fi
                remaining=$((max_docs_bytes - docs_context_bytes))
                block_bytes=$(printf "%s" "$block" | wc -c | tr -d ' ')
                if [ "$block_bytes" -gt "$remaining" ]; then
                  trimmed=$(printf "%s" "$block" | head -c "$remaining")
                  docs_context="${docs_context}${trimmed}"$'\n\n'"[docs context truncated at ${max_docs_bytes} bytes]"
                  docs_context_bytes=$max_docs_bytes
                  break
                fi
                docs_context="${docs_context}${block}"
                docs_context_bytes=$((docs_context_bytes + block_bytes))
              else
                echo "Warning: docs file not found: $file"
              fi
            done
          fi
          if [ -z "$docs_context" ]; then
            echo "Warning: No docs context loaded (missing files or docs checkout unavailable)."
          fi

          export DOCS_CONTEXT="$docs_context"

          if [ -z "${PROJECT_CONTEXT:-}" ]; then
            echo "No project_context provided; using default context."
          fi
          if [ -s "${SUMMARY_PATH:-}" ]; then
            SUMMARY_BLOCK=$(cat "$SUMMARY_PATH")
          else
            SUMMARY_BLOCK=""
          fi
          export SUMMARY_BLOCK

          python - > /tmp/deepseek_runner.log 2>&1 << 'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          diff_path = Path("/tmp/pr_diff.txt")
          summary_path = Path("/tmp/pr_summary.txt")
          history_path = Path("/tmp/pr_history.txt")
          qa_path = Path("/tmp/pr_qa_history.txt")
          sha_path = Path("/tmp/reviewed_sha.txt")
          response_path = Path("/tmp/deepseek_response.json")

          api_key = os.environ.get("DEEPSEEK_API_KEY")
          context = os.environ.get("PROJECT_CONTEXT") or "General Codebase (context not provided)"
          docs_context = os.environ.get("DOCS_CONTEXT") or ""

          diff_cap_bytes = int(os.environ.get("DIFF_CAP_BYTES", "300000"))
          diff_raw = diff_path.read_bytes() if diff_path.exists() else b""
          diff_truncated = len(diff_raw) > diff_cap_bytes
          if diff_truncated:
              diff_raw = diff_raw[:diff_cap_bytes]
          diff = diff_raw.decode("utf-8", errors="ignore")
          if diff_truncated:
              diff += f"\n\n[diff truncated at {diff_cap_bytes} bytes; deleted-file hunks are excluded]"

          summary_block = summary_path.read_text(encoding="utf-8", errors="ignore").strip() if summary_path.exists() else ""
          previous_review = history_path.read_text(encoding="utf-8", errors="ignore").strip() if history_path.exists() else ""
          qa_history = qa_path.read_text(encoding="utf-8", errors="ignore").strip() if qa_path.exists() else ""
          reviewed_sha = sha_path.read_text(encoding="utf-8", errors="ignore").strip() if sha_path.exists() else ""

          def _collect_previous_review_file_context(previous_review: str) -> str:
              if not previous_review or "No previous DeepSeek review found" in previous_review:
                  return ""

              path_re = re.compile(
                  r"(?P<path>(?:[A-Za-z0-9_.-]+/)+[A-Za-z0-9_.-]+\."
                  r"(?:dart|rs|py|toml|yaml|yml|json|md|txt|sh|js|ts|tsx|jsx))"
                  r"(?::(?P<line>\d+))?"
              )
              refs = {}
              for match in path_re.finditer(previous_review):
                  path = match.group("path")
                  line = match.group("line")
                  if path.startswith((".git/", "node_modules/", "target/", "build/")):
                      continue
                  refs.setdefault(path, set())
                  if line:
                      refs[path].add(int(line))

              if not refs:
                  return ""

              workspace = Path.cwd().resolve()
              total_cap = 60000
              file_cap = 14000
              window = 45
              parts = ["## Current File Context For Previous Findings"]
              used = 0

              for rel_path, lines in list(refs.items())[:8]:
                  safe_path = (workspace / rel_path).resolve()
                  if not safe_path.is_file() or not str(safe_path).startswith(str(workspace)):
                      continue
                  text = safe_path.read_text(encoding="utf-8", errors="ignore")
                  file_lines = text.splitlines()
                  if lines:
                      ranges = []
                      for line in sorted(lines)[:6]:
                          start = max(1, line - window)
                          end = min(len(file_lines), line + window)
                          ranges.append((start, end))
                      merged = []
                      for start, end in ranges:
                          if merged and start <= merged[-1][1] + 1:
                              merged[-1] = (merged[-1][0], max(merged[-1][1], end))
                          else:
                              merged.append((start, end))
                      snippet_parts = []
                      for start, end in merged:
                          body = "\n".join(
                              f"{idx}: {file_lines[idx - 1]}"
                              for idx in range(start, end + 1)
                          )
                          snippet_parts.append(f"--- {rel_path}:{start}-{end} ---\n{body}")
                      snippet = "\n".join(snippet_parts)
                  else:
                      snippet = "\n".join(
                          f"{idx}: {line}"
                          for idx, line in enumerate(file_lines[:160], start=1)
                      )

                  encoded = snippet.encode("utf-8", errors="ignore")
                  if len(encoded) > file_cap:
                      snippet = encoded[:file_cap].decode("utf-8", errors="ignore")
                      snippet += f"\n[previous-review file context truncated at {file_cap} bytes]"
                  block = f"=== Current file: {rel_path} ===\n{snippet}"
                  block_bytes = len(block.encode("utf-8", errors="ignore"))
                  if used + block_bytes > total_cap:
                      parts.append(f"[previous-review file context truncated at {total_cap} bytes]")
                      break
                  parts.append(block)
                  used += block_bytes

              if len(parts) == 1:
                  return ""
              return "\n\n".join(parts)

          previous_file_context = _collect_previous_review_file_context(previous_review)

          incremental_diff = ""
          if reviewed_sha:
              try:
                  import subprocess
                  subprocess.check_call(["git", "cat-file", "-e", reviewed_sha], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  inc_raw = subprocess.check_output(
                      ["git", "diff", "--unified=0", "--no-color", "--diff-filter=ACMRTUXB", reviewed_sha, "HEAD"],
                      text=True
                  )
                  if inc_raw.strip():
                      inc_raw_bytes = inc_raw.encode("utf-8", errors="ignore")
                      inc_truncated = len(inc_raw_bytes) > diff_cap_bytes
                      if inc_truncated:
                          inc_raw_bytes = inc_raw_bytes[:diff_cap_bytes]
                      incremental_diff = inc_raw_bytes.decode("utf-8", errors="ignore")
                      if inc_truncated:
                          incremental_diff += f"\n\n[incremental diff truncated at {diff_cap_bytes} bytes]"
                      print(f"Loaded incremental diff since {reviewed_sha}")
              except Exception as exc:
                  print(f"Could not load incremental diff since {reviewed_sha}: {exc}")

          system_prompt_parts = [
              "You are a senior code reviewer. Use the provided project context to interpret APIs and patterns.",
              f"Project context: {context}",
              "",
          ]

          if docs_context:
              system_prompt_parts.extend([
                  "## TV7 Project Documentation",
                  "The following documentation files provide architectural context and best practices:",
                  docs_context,
                  "",
              ])

          if previous_review and "No previous DeepSeek review found" not in previous_review:
              system_prompt_parts.extend([
                  "## Previous DeepSeek Review Context",
                  "A previous review was completed for a prior iteration of this PR with these comments/findings:",
                  "---",
                  previous_review,
                  "---",
                  "In the current diff, the author may have addressed some of these comments.",
                  "",
              ])

          if previous_file_context:
              system_prompt_parts.extend([
                  previous_file_context,
                  "",
                  "Use this current file context to verify whether previous findings are still true before repeating them.",
                  "",
              ])

          if qa_history and "No previous PR discussions found" not in qa_history:
              system_prompt_parts.extend([
                  qa_history,
                  "",
              ])

          system_prompt_parts.extend([
              "## CRITICAL REVIEW GUARDRAILS (To Avoid False Positives)",
              "1. HUNK BOUNDARY CONSTRAINT: You must ONLY comment on code lines that are explicitly added, removed, or modified inside the provided diff hunks. If you suspect an issue in an untouched function or sibling line that is not in the diff, you MUST ignore it. Do not speculate on untouched code.",
              "2. SIBLING FILE/IMPORTS TRUST: If a class, method, variable, or decorator is imported or referenced from another file or package, assume it is completely valid and correct. Do not claim it is 'missing' or 'undefined' unless it is explicitly defined incorrectly within the current diff.",
              "3. NIT vs CRITICAL THRESHOLD: '### Findings' must be reserved strictly for critical issues (logic bugs, security vulnerabilities, API contract violations, and immediate runtime failures). Stylistic preferences, optional enhancements, or minor nits must NEVER be placed in Findings or affect the final verdict; place them solely in '### Recommendations'.",
              "4. FOLLOW-UP VERIFICATION: Prior review findings are not automatically current findings. Before repeating any previous finding, compare it against the current diff, incremental diff, and current file context. If the cited code now contains the requested fix, mark the prior item addressed under Follow-up and do not repeat it under Findings.",
              "",
              "## CONTEXT REQUEST CAPABILITY",
              "If you see an unfamiliar symbol, custom class definition, or need to inspect another local codebase file to verify if a finding is a false positive, you can request its contents from the environment.",
              "To do so, output EXACTLY this JSON tool call block in your response and make no other comments or text:",
              "REQUEST_CONTEXT: [\"path/to/file.py\", ...]",
              "You can request up to 3 files. The environment will read them and provide them in the next turn.",
              "If you have all the context you need, output your final review directly.",
              "",
              "## OUTPUT STRUCTURE",
              "- Use this exact mini-structure with these Markdown h3 section headers in order:",
              "  ### Summary",
          ])

          if previous_review and "No previous DeepSeek review found" not in previous_review:
              system_prompt_parts.append("  ### Follow-up on Previous Review")

          system_prompt_parts.extend([
              "  ### Findings",
              "  ### Risks",
              "  ### Recommendations",
              "- Under ### Findings, explain each issue with: problem, impact, and evidence (`path[:line]`).",
              "- If no meaningful findings exist, say so explicitly under ### Findings.",
          ])

          if previous_review and "No previous DeepSeek review found" not in previous_review:
              system_prompt_parts.append("- Under ### Follow-up on Previous Review, explicitly list each previous finding and state whether it is addressed, still valid, or unverifiable from the current context. Only move a previous finding into ### Findings when current evidence proves it remains valid.")

          system_prompt_parts.extend([
              "At the end of your review, add one final line in this format:",
              "## FINAL_VERDICT: ✅ APPROVED (NN%) or ## FINAL_VERDICT: ❌ REJECTED (NN%)",
              "Use APPROVED when remaining issues are minor or non-blocking. ",
              "Use REJECTED when you see blocking or high-risk issues that should be addressed before merge. ",
              "Choose NN as an integer from 0 to 100 reflecting your overall confidence/quality score.",
          ])

          system_prompt = "\n".join(system_prompt_parts)

          messages = [
              {"role": "system", "content": system_prompt}
          ]

          user_content = [
              f"Repository summary:\n{summary_block}",
              f"Review this PR diff (unified=0):\n\n{diff}"
          ]
          if incremental_diff:
              user_content.append(f"## Incremental Changes (Since Last Reviewed Commit):\n\n{incremental_diff}")

          messages.append({"role": "user", "content": "\n\n".join(user_content)})

          max_turns = 2
          turn = 0
          final_content = ""

          while turn < max_turns:
              turn += 1
              print(f"=== DeepSeek API Turn {turn} ===")
              
              payload = {
                  "model": "deepseek-coder",
                  "messages": messages,
                  "temperature": 0.2
              }
              
              req = urllib.request.Request(
                  "https://api.deepseek.com/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {api_key}"
                  },
                  method="POST"
              )
              
              try:
                  with urllib.request.urlopen(req, timeout=60) as res:
                      res_data = json.loads(res.read().decode("utf-8"))
                      response_json = res_data
                      content = res_data["choices"][0]["message"]["content"] or ""
              except Exception as exc:
                  print(f"API call failed: {exc}")
                  break
                  
              print(f"Received API response (bytes: {len(content)})")
              
              if "REQUEST_CONTEXT:" in content:
                  match = re.search(r"REQUEST_CONTEXT:\s*(\[.*?\])", content, re.DOTALL)
                  if match:
                      try:
                          requested_files = json.loads(match.group(1))
                          print(f"Model requested context files: {requested_files}")
                          
                          context_blocks = []
                          for file_path in requested_files:
                              safe_path = Path(file_path).resolve()
                              if safe_path.is_file() and str(safe_path).startswith(os.getcwd()):
                                  file_content = safe_path.read_text(encoding="utf-8", errors="ignore")
                                  context_blocks.append(f"=== File: {file_path} ===\n{file_content}")
                              else:
                                  context_blocks.append(f"=== File: {file_path} ===\n[File not found or access denied]")
                                  
                          messages.append({"role": "assistant", "content": content})
                          messages.append({
                              "role": "user",
                              "content": "Here is the requested file context:\n\n" + "\n\n".join(context_blocks)
                          })
                          continue
                      except Exception as e:
                          print(f"Error reading context files: {e}")
                          
              final_content = content
              response_path.write_text(json.dumps(response_json, indent=2) + "\n", encoding="utf-8")
              break

          if not final_content:
              print("Error: No review content was produced.")
              sys.exit(1)
          PY

          # Cat runner logs for visibility in GH Actions output
          cat /tmp/deepseek_runner.log || true

          content=$(jq -r '.choices[0].message.content // ""' /tmp/deepseek_response.json)
          content_bytes=$(printf "%s" "$content" | wc -c | tr -d ' ')

          if [ -z "$content" ]; then
            echo "No DeepSeek content returned; skipping comment."
            exit 0
          elif [ "$content_bytes" -gt 20000 ]; then
            echo "DeepSeek content too large (${content_bytes} bytes); skipping comment to control cost."
            exit 0
          fi

          {
            echo "content<<CONTENT_EOF"
            echo "$content"
            echo "CONTENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize DeepSeek review comment
        if: steps.guard.outputs.should-run == 'true' && steps.deepseek.outputs.content != ''
        id: normalize
        shell: bash
        env:
          CONTENT: ${{ steps.deepseek.outputs.content }}
          CHANGED_FILES_PATH: ${{ steps.diff.outputs.changed-files-path }}
        run: |
          set -eo pipefail
          content_file=/tmp/deepseek_content.txt
          output_json=/tmp/deepseek_normalized_review.json
          printf "%s" "$CONTENT" > "$content_file"
          
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          RE_VERDICT = re.compile(r"FINAL_VERDICT:\s*(?:[✅❌]\s*)?(APPROVED|REJECTED)", re.IGNORECASE)
          RE_CONFIDENCE = re.compile(r"\((\d{1,3})%\)")

          def _extract_verdict(raw: str) -> tuple[str, str, str]:
              event = "COMMENT"
              verdict_label = "COMMENT"
              confidence = "unknown"
              for line in str(raw or "").splitlines():
                  if "final_verdict" not in line.lower():
                      continue
                  match = RE_VERDICT.search(line)
                  if not match:
                      continue
                  verdict = match.group(1).strip().upper()
                  verdict_label = verdict
                  event = "APPROVE" if verdict == "APPROVED" else "REQUEST_CHANGES"
                  conf = RE_CONFIDENCE.search(line)
                  if conf:
                      confidence = f"{min(100, max(0, int(conf.group(1))))}%"
                  break
              return event, verdict_label, confidence

          def _normalize_model_body(raw: str) -> str:
              text = str(raw or "").strip()
              if not text:
                  return "No model narrative was returned."
              lines = [line.rstrip() for line in text.splitlines()]
              if lines and lines[0].strip().lower() in {"deepseek review", "### deepseek review"}:
                  lines = lines[1:]
              return "\n".join(lines).strip() or "No model narrative was returned."

          def normalize_review_comment(content: str) -> dict[str, object]:
              event, verdict_label, confidence = _extract_verdict(content)
              narrative = _normalize_model_body(content)

              lines = [
                  "### DeepSeek review",
                  f"- Confidence: {confidence}",
                  f"- Final verdict: {verdict_label}",
                  "",
                  narrative,
              ]
              if event == "COMMENT":
                  lines.extend([
                      "",
                      "_Parser note: verdict not detected; posted as informational comment._",
                  ])

              body = "\n".join(lines).strip()
              return {
                  "event": event,
                  "verdict": verdict_label,
                  "confidence": confidence,
                  "findings": [],
                  "finding_code_refs": [],
                  "body": body,
              }

          content_path = Path("/tmp/deepseek_content.txt")
          content = content_path.read_text(encoding="utf-8", errors="ignore") if content_path.is_file() else ""
          normalized = normalize_review_comment(content)
          Path("/tmp/deepseek_normalized_review.json").write_text(json.dumps(normalized, indent=2) + "\n", encoding="utf-8")
          PY

          event=$(jq -r '.event // "COMMENT"' "$output_json")
          confidence=$(jq -r '.confidence // "unknown"' "$output_json")
          verdict=$(jq -r '.verdict // "COMMENT"' "$output_json")
          body=$(jq -r '.body // ""' "$output_json")

          echo "event=$event" >> "$GITHUB_OUTPUT"
          echo "confidence=$confidence" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"


      - name: Submit DeepSeek review (approve or request changes)
        if: steps.guard.outputs.should-run == 'true' && steps.normalize.outputs.body != ''
        uses: actions/github-script@v7
        env:
          NORMALIZED_BODY: ${{ steps.normalize.outputs.body }}
          NORMALIZED_EVENT: ${{ steps.normalize.outputs.event }}
          NORMALIZED_CONFIDENCE: ${{ steps.normalize.outputs.confidence }}
          NORMALIZED_VERDICT: ${{ steps.normalize.outputs.verdict }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = (process.env.NORMALIZED_BODY || '').trim();
            const event = (process.env.NORMALIZED_EVENT || 'COMMENT').trim();
            const confidence = (process.env.NORMALIZED_CONFIDENCE || 'unknown').trim();
            const verdict = (process.env.NORMALIZED_VERDICT || 'COMMENT').trim();
            if (!body) {
              throw new Error('Missing normalized DeepSeek review body.');
            }

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let finalEvent = event;
            let url = '(unknown)';

            try {
              const res = await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                body,
                event: finalEvent,
              });
              url = res?.data?.html_url || url;
              console.log(`Submitted DeepSeek review (${finalEvent}) to PR #${prNumber}: ${url}`);
            } catch (err) {
              const msg = `${err}`;
              const forbiddenApprove =
                event === 'APPROVE' &&
                err.status === 422 &&
                msg.includes('not permitted to approve');
              if (forbiddenApprove) {
                console.log('Cannot approve via GitHub Actions token; falling back to COMMENT event.');
                finalEvent = 'COMMENT';
                const res = await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: prNumber,
                  body,
                  event: finalEvent,
                });
                url = res?.data?.html_url || url;
              } else {
                throw err;
              }
            }

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) {
              fs.appendFileSync(
                summaryPath,
                `DeepSeek review submitted (${finalEvent}) to PR #${prNumber}: ${url} (verdict=${verdict}, confidence=${confidence})\n`
              );
            }
