# Reusable DeepSeek review workflow.
# Purpose: run DeepSeek on PR diffs with branch/size guardrails and post a single PR comment.
# Required secret: DEEPSEEK_API_KEY (inherit secrets in the caller).
# Usage (same repo): uses: ./.github/workflows/deepseek-review.yml
# Usage (from other repos): uses: TV7-Clip-Studio/tv7-core/.github/workflows/deepseek-review.yml@main

name: DeepSeek Review (reusable)

on:
  workflow_call:
    inputs:
      run_on_branches:
        description: "Comma/space-separated base branches allowed to run DeepSeek on (default: main)."
        required: false
        type: string
        default: "main"
      min_changed_lines:
        description: "Minimum total changed lines (additions + deletions) to run DeepSeek."
        required: false
        type: number
        default: 5
      project_context:
        description: "Short project context string provided by the caller (SDK/framework versions, key deps)."
        required: false
        type: string
        default: "General Codebase (context not provided)"
      architecture_doc:
        description: "Single architecture doc filename from tv7-core/docs to include (e.g., backend_architecture.md)."
        required: false
        type: string
        default: ""
      core_doc_list:
        description: "Space-separated list of core docs (filenames in docs/) to include (default: tv7_high_architecture.md roadmap.md)."
        required: false
        type: string
        default: "tv7_high_architecture.md roadmap.md"
      update_pr_meta:
        description: "If true, use PR_TITLE / PR_SUMMARY from DeepSeek output to update the PR title/body (with safeguards)."
        required: false
        type: boolean
        default: true
    secrets:
      DEEPSEEK_API_KEY:
        required: true
      TV7_CORE_APP_ID:
        required: false
      TV7_CORE_APP_PRIVATE_KEY:
        required: false

jobs:
  deepseek-review:
    name: DeepSeek Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App token (tv7-core docs)
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TV7_CORE_APP_ID }}
          private-key: ${{ secrets.TV7_CORE_APP_PRIVATE_KEY }}
          owner: TV7-Clip-Studio
          repositories: tv7-core
        continue-on-error: true

      - name: Debug app token minted
        run: |
          echo "Has app id? ${{ secrets.TV7_CORE_APP_ID != '' }}"
          echo "Has private key? ${{ secrets.TV7_CORE_APP_PRIVATE_KEY != '' }}"
          echo "Token present? ${{ steps.app-token.outputs.token != '' }}"

      - name: Checkout tv7-core docs (context)
        if: steps.app-token.outputs.token != ''
        uses: actions/checkout@v4
        with:
          repository: TV7-Clip-Studio/tv7-core
          ref: main
          path: temp-tv7-core-docs
          sparse-checkout: |
            docs
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip tv7-core docs checkout (fork/missing app secrets)
        if: steps.app-token.outputs.token == ''
        run: echo "Skipping tv7-core docs checkout (fork PR or missing app secrets)."


      - name: Guard - branch and change thresholds
        id: guard
        shell: bash
        env:
          RUN_ON_BRANCHES: ${{ inputs.run_on_branches }}
          MIN_CHANGED: ${{ inputs.min_changed_lines }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          should_run=true
          reason="ok"
          changed_lines=0

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            should_run=false
            reason="Not a pull_request event; skipping"
          elif [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            should_run=false
            reason="Fork PR detected; DeepSeek review disabled for forks"
          else
            changed_lines=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk '{add+=$1; del+=$2} END {print add+del+0}')
            match=false
            for raw in $(echo "$RUN_ON_BRANCHES" | tr ',' ' '); do
              branch=$(echo "$raw" | xargs)
              [ -z "$branch" ] && continue
              if [ "$BASE_REF" = "$branch" ]; then
                match=true
              fi
            done
            if [ "$match" != "true" ]; then
              should_run=false
              reason="Base branch '$BASE_REF' not in run_on_branches '$RUN_ON_BRANCHES'"
            elif [ "$changed_lines" -lt "$MIN_CHANGED" ]; then
              should_run=false
              reason="Changed lines $changed_lines below threshold $MIN_CHANGED"
            fi
          fi

          {
            echo "should-run=$should_run"
            echo "reason=$reason"
            echo "changed-lines=$changed_lines"
          } >> "$GITHUB_OUTPUT"

      - name: Skip DeepSeek review
        if: steps.guard.outputs.should-run != 'true'
        run: |
          echo "Skipping DeepSeek review: ${{ steps.guard.outputs.reason }}"

      - name: Collect PR diff (full, unified=0)
        if: steps.guard.outputs.should-run == 'true'
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          git diff --unified=0 --no-color "$BASE_SHA" "$HEAD_SHA" > /tmp/pr_diff.txt
          bytes=$(wc -c < /tmp/pr_diff.txt | tr -d ' ')
          echo "diff-bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Build PR summary (changed files + repo file map)
        if: steps.guard.outputs.should-run == 'true'
        id: summary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUMMARY_CAP_BYTES: 200000
        run: |
          set -eo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          cap_bytes = int(os.environ.get("SUMMARY_CAP_BYTES", "200000"))
          summary_path = Path("/tmp/pr_summary.txt")

          def run(cmd: list[str]) -> list[str]:
            out = subprocess.check_output(cmd, text=True)
            return [line for line in out.splitlines() if line.strip()]

          name_status = run(["git", "diff", "--name-status", base, head])
          numstat = run(["git", "diff", "--numstat", base, head])
          file_list = run(["git", "ls-tree", "-r", "--name-only", head])

          status_map: dict[str, str] = {}
          for line in name_status:
            parts = line.split("\t", 1)
            if len(parts) != 2:
              continue
            status, path = parts
            status_map[path] = status

          adds_dels: dict[str, tuple[str, str]] = {}
          for line in numstat:
            parts = line.split("\t")
            if len(parts) >= 3:
              add, delete, path = parts[0], parts[1], parts[2]
              adds_dels[path] = (add, delete)

          lines: list[str] = []
          lines.append("=== Changed files (status add/del) ===")
          if not status_map:
            lines.append("(none)")
          else:
            for path, status in status_map.items():
              add, delete = adds_dels.get(path, ("-", "-"))
              lines.append(f"[{status}] +{add}/-{delete} {path}")

          lines.append("")
          lines.append("=== Repo files (marked if changed) ===")
          if not file_list:
            lines.append("(none)")
          else:
            for path in file_list:
              mark = status_map.get(path, " ")
              lines.append(f"[{mark}] {path}")

          text = "\n".join(lines)
          truncated = False
          # Truncate safely on character boundaries until encoded length <= cap_bytes
          while len(text.encode("utf-8")) > cap_bytes:
            truncated = True
            # remove a chunk to speed up trimming on very large summaries
            text = text[:-1000] if len(text) > 1000 else text[:-1]
          if truncated:
            text += f"\n\n[summary truncated at {cap_bytes} bytes]"

          encoded = text.encode("utf-8")
          summary_path.write_text(text, encoding="utf-8")
          print(f"summary-bytes={len(encoded)}")
          if truncated:
            print("summary-truncated=true")
          PY
          echo "summary-path=/tmp/pr_summary.txt" >> "$GITHUB_OUTPUT"

      - name: Log context inputs
        if: steps.guard.outputs.should-run == 'true'
        run: |
          summary_bytes=$(wc -c < /tmp/pr_summary.txt 2>/dev/null || echo 0)
          diff_bytes=$(wc -c < /tmp/pr_diff.txt 2>/dev/null || echo 0)
          echo "Context: summary bytes=${summary_bytes}, diff bytes=${diff_bytes}"
          echo "Requested architecture_doc='${{ inputs.architecture_doc }}'"
          echo "Core doc list='${{ inputs.core_doc_list }}'"

      - name: Call DeepSeek
        if: steps.guard.outputs.should-run == 'true'
        id: deepseek
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DIFF_PATH: /tmp/pr_diff.txt
          SUMMARY_PATH: /tmp/pr_summary.txt
          PROJECT_CONTEXT: ${{ inputs.project_context }}
          DOCS_PATH: temp-tv7-core-docs/docs
          ARCH_DOC: ${{ inputs.architecture_doc }}
          CORE_DOC_LIST: ${{ inputs.core_doc_list }}
        run: |
          set -eo pipefail
          if [ ! -s "$DIFF_PATH" ]; then
            echo "No diff content found; skipping call."
            exit 0
          fi

          # Load allowed context files from docs/
          docs_context=""
          safe_arch_doc=""
          safe_core_docs=()

          # validate and collect core doc list
          if [ -n "${CORE_DOC_LIST:-}" ]; then
            for candidate in ${CORE_DOC_LIST}; do
              if [[ "$candidate" != */* && "$candidate" != *..* && "$candidate" == *.md ]]; then
                safe_core_docs+=("$candidate")
              else
                echo "Warning: core doc '${candidate}' is invalid (must be basename ending in .md); ignoring."
              fi
            done
          fi

          if [ -n "${ARCH_DOC:-}" ]; then
            # validate: basename only, no slash/.., must end with .md
            if [[ "$ARCH_DOC" != */* && "$ARCH_DOC" != *..* && "$ARCH_DOC" == *.md ]]; then
              safe_arch_doc="$ARCH_DOC"
            else
              echo "Warning: ARCH_DOC '${ARCH_DOC}' is invalid (must be basename ending in .md); ignoring."
            fi
          fi

          if [ -d "$DOCS_PATH" ]; then
            files_to_include="${safe_core_docs[*]}"
            if [ -n "$safe_arch_doc" ]; then
              files_to_include="$files_to_include $safe_arch_doc"
            fi
            for filename in $files_to_include; do
              file="$DOCS_PATH/$filename"
              if [ -f "$file" ]; then
                content=$(cat "$file")
                docs_context="${docs_context}\n\n=== Documentation: ${filename} ===\n${content}"
              else
                echo "Warning: docs file not found: $file"
              fi
            done
          fi
          if [ -z "$docs_context" ]; then
            echo "Warning: No docs context loaded (missing files or docs checkout unavailable)."
          fi

          export DOCS_CONTEXT="$docs_context"

          if [ -z "${PROJECT_CONTEXT:-}" ]; then
            echo "No project_context provided; using default context."
          fi
          if [ -s "${SUMMARY_PATH:-}" ]; then
            SUMMARY_BLOCK=$(cat "$SUMMARY_PATH")
          else
            SUMMARY_BLOCK=""
          fi
          export SUMMARY_BLOCK

          payload=$(python - "$DIFF_PATH" << 'PY'
          import json, os, sys
          from pathlib import Path

          diff = Path(sys.argv[1]).read_text(encoding="utf-8")
          context = os.environ.get("PROJECT_CONTEXT") or "General Codebase (context not provided)"
          docs_context = os.environ.get("DOCS_CONTEXT") or ""
          summary_block = os.environ.get("SUMMARY_BLOCK") or ""

          # Build the composite system prompt
          system_prompt_parts = [
              "You are a senior code reviewer. Use the provided project context to interpret APIs and patterns.",
              f"Project context: {context}",
              "",
          ]

          if docs_context:
              system_prompt_parts.append("## TV7 Project Documentation")
              system_prompt_parts.append("The following documentation files provide architectural context and best practices:")
              system_prompt_parts.append(docs_context)
              system_prompt_parts.append("")

          system_prompt_parts.extend([
              "- If an API or symbol is unfamiliar, assume it may be project-defined; avoid claiming it does not exist.",
              "- Use version information to reason about availability; do not suggest downgrades to older APIs.",
              "- Prioritize logic errors, security issues, edge cases, and architectural risks.",
              "- Be concise and high-signal. Do not restate diffs.",
              "- At the top of your response, provide a copy-pasteable PR title and a 2-4 sentence summary of the changes in this format:",
              "PR_TITLE: <concise title>",
              "PR_SUMMARY: <short summary>",
              "Then continue with your review (key changes, risks, etc.) as usual.",
              "- Present your key changes/summary as a numbered list.",
              "At the end of your review, add one final line in this format:",
              "## FINAL_VERDICT: ✅ APPROVED (NN%) or ## FINAL_VERDICT: ❌ REJECTED (NN%)",
              "Use APPROVED when remaining issues are minor or non-blocking. ",
              "Use REJECTED when you see blocking or high-risk issues that should be addressed before merge. ",
              "Choose NN as an integer from 0 to 100 reflecting your overall confidence/quality score.",
          ])

          system_prompt = "\n".join(system_prompt_parts)

          payload = {
              "model": "deepseek-coder",
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": f"Repository summary:\\n{summary_block}\\n\\nReview this PR diff (unified=0):\\n\\n{diff}"},
              ],
              "temperature": 0.2,
          }

          print(json.dumps(payload))
          PY
          )

          response=$(curl -sS --max-time 60 --retry 2 --retry-delay 2 \
            -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "$payload" || true)

          echo "$response" > /tmp/deepseek_response.json
          content=$(jq -r '.choices[0].message.content // ""' /tmp/deepseek_response.json)
          content_bytes=$(printf "%s" "$content" | wc -c | tr -d ' ')

          if [ -z "$content" ]; then
            echo "No DeepSeek content returned; skipping comment."
            exit 0
          elif [ "$content_bytes" -gt 20000 ]; then
            echo "DeepSeek content too large (${content_bytes} bytes); skipping comment to control cost."
            exit 0
          fi

          {
            echo "content<<CONTENT_EOF"
            echo "$content"
            echo "CONTENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Parse DeepSeek verdict
        if: steps.guard.outputs.should-run == 'true' && steps.deepseek.outputs.content != ''
        id: verdict
        shell: bash
        env:
          CONTENT: ${{ steps.deepseek.outputs.content }}
        run: |
          set -eo pipefail
          line=$(printf "%s\n" "$CONTENT" | grep -E 'FINAL_VERDICT' | tail -1 || true)
          verdict=""
          if echo "$line" | grep -qi 'APPROVED'; then
            verdict="APPROVE"
          elif echo "$line" | grep -qi 'REJECTED'; then
            verdict="REQUEST_CHANGES"
          fi
          echo "line=$line"
          echo "verdict=$verdict"
          {
            echo "line=$line"
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"

      - name: Parse PR title/summary from DeepSeek content
        if: steps.guard.outputs.should-run == 'true' && steps.deepseek.outputs.content != ''
        id: prmeta
        shell: bash
        env:
          CONTENT: ${{ steps.deepseek.outputs.content }}
        run: |
          set -eo pipefail
          pr_title=$(printf "%s\n" "$CONTENT" | grep -E '^PR_TITLE:' | head -1 | sed 's/^PR_TITLE:[[:space:]]*//')
          pr_summary=$(printf "%s\n" "$CONTENT" | grep -E '^PR_SUMMARY:' | head -1 | sed 's/^PR_SUMMARY:[[:space:]]*//')
          echo "title=$pr_title"
          echo "summary=$pr_summary"
          {
            echo "title=$pr_title"
            echo "summary=$pr_summary"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare review body (strip PR_TITLE/PR_SUMMARY)
        if: steps.guard.outputs.should-run == 'true' && steps.deepseek.outputs.content != ''
        id: review_body
        shell: bash
        env:
          CONTENT: ${{ steps.deepseek.outputs.content }}
        run: |
          set -eo pipefail
          cleaned=$(python - "$CONTENT" <<'PY'
          import sys, re
          raw = sys.argv[1]
          lines = raw.splitlines()
          kept = [ln for ln in lines if not re.match(r'^PR_(TITLE|SUMMARY):', ln.strip())]
          text = "\n".join(kept).strip()
          if not text:
              text = raw
          print(text)
          PY
          )
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$cleaned" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Submit DeepSeek review (approve or request changes)
        if: steps.guard.outputs.should-run == 'true' && steps.verdict.outputs.verdict != ''
        uses: actions/github-script@v7
        env:
          DEEPSEEK_CONTENT: ${{ steps.review_body.outputs.body }}
          VERDICT_EVENT: ${{ steps.verdict.outputs.verdict }}
          VERDICT_LINE: ${{ steps.verdict.outputs.line }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = (process.env.DEEPSEEK_CONTENT || '').trim();
            const event = (process.env.VERDICT_EVENT || '').trim(); // APPROVE or REQUEST_CHANGES
            const verdictLine = (process.env.VERDICT_LINE || '').trim();
            if (!content || !event) {
              throw new Error('Missing DeepSeek content or verdict event; cannot submit review.');
            }

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const body = `### DeepSeek review
            ${content}`;

            let finalEvent = event;
            let url = '(unknown)';

            try {
              const res = await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                body,
                event: finalEvent,
              });
              url = res?.data?.html_url || url;
              console.log(`Submitted DeepSeek review (${finalEvent}) to PR #${prNumber}: ${url}`);
            } catch (err) {
              const msg = `${err}`;
              const forbiddenApprove =
                event === 'APPROVE' &&
                err.status === 422 &&
                msg.includes('not permitted to approve');
              if (forbiddenApprove) {
                console.log('Cannot approve via GitHub Actions token; falling back to COMMENT event.');
                finalEvent = 'COMMENT';
                const res = await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: prNumber,
                  body,
                  event: finalEvent,
                });
                url = res?.data?.html_url || url;
              } else {
                throw err;
              }
            }

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) {
              fs.appendFileSync(
                summaryPath,
                `DeepSeek review submitted (${finalEvent}) to PR #${prNumber}: ${url}\n`
              );
            }

      - name: Update PR title/body from DeepSeek metadata
        if: steps.guard.outputs.should-run == 'true' && inputs.update_pr_meta && steps.prmeta.outputs.title != '' && steps.prmeta.outputs.summary != ''
        uses: actions/github-script@v7
        env:
          DS_TITLE: ${{ steps.prmeta.outputs.title }}
          DS_SUMMARY: ${{ steps.prmeta.outputs.summary }}
          DS_VERDICT_LINE: ${{ steps.verdict.outputs.line }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dsTitle = (process.env.DS_TITLE || '').trim();
            const dsSummary = (process.env.DS_SUMMARY || '').trim();
            const dsVerdictLine = (process.env.DS_VERDICT_LINE || '').trim();
            if (!dsTitle || !dsSummary) {
              console.log('No DeepSeek title/summary to apply.');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const currentTitle = pr.title || '';
            const currentBody = pr.body || '';

            // Safeguard: if author explicitly marked title with "author:" prefix, do not override.
            const blocked = currentTitle.toLowerCase().startsWith('author:');

            let newTitle = currentTitle;
            if (!blocked) {
              newTitle = dsTitle;
            } else {
              console.log('Current title marked as author-owned; not overriding.');
            }

            // Upsert AI Summary section in body
            const aiHeader = '## AI Summary';
            let newBody;
            const aiBlock = `${aiHeader}\n${dsSummary}${dsVerdictLine ? `\n\n${dsVerdictLine}` : ''}\n`;
            if (!currentBody || /^\s*$/m.test(currentBody)) {
              newBody = aiBlock;
            } else {
              const pattern = new RegExp(`${aiHeader}[\\s\\S]*?(\\n## |$)`, 'm');
              if (pattern.test(currentBody)) {
                newBody = currentBody.replace(pattern, `${aiBlock}$1`).trimEnd();
              } else {
                newBody = `${currentBody.trimEnd()}\n\n${aiBlock}`;
              }
            }

            const patch = {};
            if (newTitle !== currentTitle) patch.title = newTitle;
            if (newBody !== currentBody) patch.body = newBody;

            if (Object.keys(patch).length === 0) {
              console.log('No PR metadata changes to apply.');
              return;
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              ...patch,
            });

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) {
              const lines = [`PR metadata updated:`, `- title: ${newTitle !== currentTitle ? 'updated' : 'unchanged'}`, `- body: ${newBody !== currentBody ? 'updated (AI Summary section)' : 'unchanged'}`];
              require('fs').appendFileSync(summaryPath, lines.join('\n') + '\n');
            }
