# Reusable DeepSeek review workflow.

name: DeepSeek Review (reusable)

on:
  workflow_call:
    inputs:
      run_on_branches:
        description: "Comma/space-separated base branches allowed to run DeepSeek on (default: main)."
        required: false
        type: string
        default: "main"
      min_changed_lines:
        description: "Minimum total changed lines (additions + deletions) to run DeepSeek."
        required: false
        type: number
        default: 5
      project_context:
        description: "Short project context string provided by the caller."
        required: false
        type: string
        default: "General Codebase (context not provided)"

jobs:
  deepseek-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard - branch and change thresholds
        id: guard
        shell: bash
        env:
          RUN_ON_BRANCHES: ${{ inputs.run_on_branches }}
          MIN_CHANGED: ${{ inputs.min_changed_lines }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eo pipefail

          should_run=true
          reason="ok"
          changed_lines=0

          changed_lines=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk '{add+=$1; del+=$2} END {print add+del+0}')

          match=false
          for raw in $(echo "$RUN_ON_BRANCHES" | tr ',' ' '); do
            branch=$(echo "$raw" | xargs)
            [ -z "$branch" ] && continue
            if [ "$BASE_REF" = "$branch" ]; then
              match=true
            fi
          done

          if [ "$match" != "true" ]; then
            should_run=false
            reason="Base branch mismatch"
          elif [ "$changed_lines" -lt "$MIN_CHANGED" ]; then
            should_run=false
            reason="Changed lines below threshold"
          fi

          {
            echo "should-run=$should_run"
            echo "reason=$reason"
            echo "changed-lines=$changed_lines"
          } >> "$GITHUB_OUTPUT"

      - name: Skip DeepSeek review
        if: steps.guard.outputs.should-run != 'true'
        run: echo "Skipping: ${{ steps.guard.outputs.reason }}"

      - name: Collect PR diff
        if: steps.guard.outputs.should-run == 'true'
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --unified=3 --no-color "$BASE_SHA" "$HEAD_SHA" | head -c 120000 > /tmp/pr_diff.txt

      - name: Call DeepSeek
        if: steps.guard.outputs.should-run == 'true'
        id: deepseek
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DIFF_PATH: /tmp/pr_diff.txt
          PROJECT_CONTEXT: ${{ inputs.project_context }}
        run: |
          payload=$(python - "$DIFF_PATH" << 'PY'
          import json, os, sys
          from pathlib import Path

          diff = Path(sys.argv[1]).read_text(encoding="utf-8")
          context = os.environ.get("PROJECT_CONTEXT") or "General Codebase"

          system_prompt = (
              "You are a senior code reviewer.\n"
              f"Project context: {context}\n"
              "- If an API is unfamiliar, assume it might be new or project-defined.\n"
              "- Prioritize logic, security, architecture.\n"
              "- Avoid incorrect 'API does not exist' claims.\n"
          )

          payload = {
              "model": "deepseek-coder",
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": f"Review this PR diff:\\n\\n{diff}"},
              ],
              "temperature": 0.2,
          }

          print(json.dumps(payload))
          PY
          )

          response=$(curl -sS \
            -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "$payload" || true)

          echo "$response" > /tmp/deepseek_response.json

          content=$(jq -r '.choices[0].message.content // ""' /tmp/deepseek_response.json)

          {
            echo "content<<EOF"
            echo "$content"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post DeepSeek feedback
        if: steps.deepseek.outputs.content != ''
        uses: actions/github-script@v7
        env:
          DEEPSEEK_CONTENT: ${{ steps.deepseek.outputs.content }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = "### DeepSeek review\n\n" + process.env.DEEPSEEK_CONTENT;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
